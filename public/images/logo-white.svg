<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 84" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="wmWhiteGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F4C430" />
    </linearGradient>
    <linearGradient id="wmWhitePetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
  </defs>

  <!-- BRANDMARK (White & Gold version for Dark/Navy Backgrounds) -->
  <g transform="translate(10, 6)">
    <!-- The Arc -->
    <path d="M 6 56 C 20 68, 52 68, 66 54 C 58 63, 30 65, 14 57 Z" fill="#93C5FD" opacity="0.6" />
    <path d="M 12 59 C 28 69, 58 66, 68 50 C 60 60, 34 65, 18 58 Z" fill="url(#wmWhiteGold)" />

    <!-- The Flower -->
    <path d="M 36 44 C 22 42, 14 30, 20 18 C 28 24, 34 34, 36 44 Z" fill="#60A5FA" opacity="0.8" />
    <path d="M 36 44 C 26 32, 26 16, 36 8 C 40 18, 40 32, 36 44 Z" fill="#FFFFFF" />
    <path d="M 36 44 C 42 32, 44 16, 44 8 C 48 18, 46 32, 36 44 Z" fill="#93C5FD" />
    <path d="M 36 44 C 46 34, 54 24, 52 18 C 50 30, 44 40, 36 44 Z" fill="#60A5FA" opacity="0.75" />
    <path d="M 36 42 C 32 34, 34 26, 38 20 C 42 26, 42 34, 36 42 Z" fill="#DBEAFE" />

    <!-- The Yellow Dot (Spark) -->
    <circle cx="39" cy="8" r="5" fill="url(#wmWhiteGold)" />
    <circle cx="39" cy="8" r="2" fill="#FFFFFF" />
  </g>

  <!-- WORDMARK -->
  <g transform="translate(92, 0)">
    <text x="0" y="44" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="1.5" fill="#FFFFFF">WISE<tspan fill="#F4C430">MINDS</tspan></text>
    <text x="1" y="62" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="9.5" letter-spacing="3.8" fill="#E2E8F0">BUSINESS CONSULTING LLP</text>
    <text x="1" y="74" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="7.5" letter-spacing="2.2" fill="#F4C430">PURPOSE <tspan fill="#93C5FD">•</tspan> PROCESS <tspan fill="#93C5FD">•</tspan> PRACTICE</text>
  </g>
</svg>
